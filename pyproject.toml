[project]
name = "agent-frameworks"
version = "0.1.0"
description = "Agent 框架深度教学：Google ADK vs LangChain / LangGraph（可执行 Jupyter 笔记，使用 DeepSeek 作为底层模型）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-adk==2.6.3",
    "jupyterlab>=4.6.3",
    "langchain==1.2.15",
    "langchain-openai==1.6.0",
    "langgraph>=1.1.5,<1.2.0",
    "litellm==1.96.2",
    "openai>=2.54.0",
    "python-dotenv>=1.2.3",
    # eval_example 复用 ADK 的 Unicode ROUGE 实现计算 response_match_score。
    # 不安装完整 [eval] extra，原因见 eval_example/README.md。
    "rouge-score>=0.1.2",
]

# 使用阿里云 PyPI 镜像作为默认源（与环境变量 UV_INDEX_URL 一致，写入项目配置保证可复现）
[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
